<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ความคืบหน้าการเรียนรู้</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:        #F7FBFF;
    --surface:   #FFFFFF;
    --surface2:  #EAF5FF;
    --border:    #D5E7F7;
    --text:      #19324D;
    --muted:     #657B91;
    --accent:    #2F80ED;
    --accent2:   #00B8A9;
    --done:      #19B978;
    --progress:  #F6B73C;
    --new:       #FF6B8A;
    --shadow:    rgba(71, 102, 132, 0.18);
  }

  body {
    font-family: 'IBM Plex Sans Thai', sans-serif;
    background:
      radial-gradient(circle at 15% 18%, rgba(255, 222, 89, 0.32), transparent 26%),
      radial-gradient(circle at 86% 14%, rgba(86, 207, 225, 0.34), transparent 25%),
      linear-gradient(135deg, #FFF8D7 0%, #EFF9FF 46%, #F7F1FF 100%);
    color: var(--text);
    min-height: 100vh;
    padding: 32px 24px 48px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    overflow-x: hidden;
  }

  /* ── Header ── */
  .page-header {
    width: 100%;
    max-width: 1180px;
    margin: 0 auto 26px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 16px;
  }

  .header-left {
    min-width: 260px;
  }

  .header-eyebrow {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.82rem;
    letter-spacing: 0.18em;
    color: var(--accent);
    text-transform: uppercase;
    margin-bottom: 8px;
  }

  .page-title {
    font-size: clamp(2.4rem, 4vw, 4.2rem);
    font-weight: 700;
    letter-spacing: 0;
    line-height: 1.1;
  }

  .page-title span {
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  .header-stats {
    display: flex;
    align-items: center;
    justify-content: flex-end;
    gap: 12px;
  }

  .learning-hours-card {
    display: flex;
    align-items: center;
    gap: 14px;
    background: rgba(255, 255, 255, 0.82);
    border: 1px solid rgba(255, 255, 255, 0.95);
    border-radius: 999px;
    padding: 10px 18px 10px 10px;
    box-shadow: 0 16px 30px rgba(78, 121, 160, 0.16);
  }

  .learning-hours-circle {
    width: 86px;
    height: 86px;
    border-radius: 50%;
    display: grid;
    place-items: center;
    background:
      linear-gradient(#fff, #fff) padding-box,
      conic-gradient(var(--accent), var(--accent2), var(--progress), var(--accent)) border-box;
    border: 7px solid transparent;
    box-shadow: inset 0 0 0 1px rgba(47, 128, 237, 0.12);
  }

  .learning-hours-num {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 2.05rem;
    font-weight: 500;
    color: var(--accent);
    line-height: 1;
  }

  .learning-hours-copy {
    min-width: 0;
  }

  .learning-hours-label {
    font-size: 1rem;
    font-weight: 600;
    color: var(--text);
    line-height: 1.25;
  }

  .learning-hours-unit {
    font-size: 0.86rem;
    color: var(--muted);
    margin-top: 4px;
  }

  /* ── Grid ── */
  .cards-grid {
    width: 100%;
    max-width: 1180px;
    margin: 0 auto 34px;
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    grid-template-rows: repeat(2, minmax(150px, auto));
    gap: 18px;
    min-width: 0;
  }

  /* ── Card ── */
  .card {
    background: rgba(255, 255, 255, 0.88);
    border: 1px solid rgba(255, 255, 255, 0.95);
    border-radius: 18px;
    padding: 22px 20px;
    display: flex;
    align-items: flex-start;
    gap: 16px;
    cursor: pointer;
    transition: transform 0.18s, box-shadow 0.18s, border-color 0.18s, background 0.18s;
    position: relative;
    overflow: hidden;
    min-height: 150px;
    min-width: 0;
    max-width: 100%;
    box-shadow: 0 18px 36px var(--shadow);
  }

  .card::before {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(135deg, var(--card-accent, var(--accent)) 0%, transparent 58%);
    opacity: 0.1;
    transition: opacity 0.2s;
    border-radius: inherit;
  }

  .card:hover {
    transform: translateY(-3px);
    background: #fff;
    box-shadow: 0 22px 44px rgba(71, 102, 132, 0.24);
    border-color: var(--card-accent, var(--accent));
  }

  .card:hover::before { opacity: 0.18; }

  /* ── Avatar ── */
  .avatar {
    flex-shrink: 0;
    width: 64px;
    height: 64px;
    border-radius: 18px;
    overflow: hidden;
    position: relative;
    background: var(--surface2);
    box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.86);
  }

  .avatar img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  /* Fallback avatar with initials */
  .avatar-fallback {
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.35rem;
    font-weight: 600;
    color: #fff;
    background: var(--card-accent, var(--accent));
    user-select: none;
  }

  /* Status dot */
  .status-dot {
    position: absolute;
    bottom: 4px;
    right: 4px;
    width: 13px;
    height: 13px;
    border-radius: 50%;
    border: 2px solid #fff;
    background: var(--muted);
  }
  .status-dot.done     { background: var(--done); }
  .status-dot.progress { background: var(--progress); }
  .status-dot.new      { background: var(--new); }

  /* ── Info ── */
  .card-info {
    flex: 1 1 0;
    width: 0;
    min-width: 0;
    position: relative;
    z-index: 1;
    overflow: hidden;
  }

  .card-name {
    font-size: 1.12rem;
    font-weight: 600;
    color: var(--text);
    white-space: normal;
    overflow: hidden;
    line-height: 1.25;
    margin-bottom: 6px;
  }

  .card-topic {
    font-size: 0.92rem;
    color: var(--muted);
    white-space: normal;
    overflow: hidden;
    line-height: 1.35;
    margin-bottom: 16px;
  }

  /* Progress bar */
  .progress-wrap {
    height: 8px;
    background: #E1EDF8;
    border-radius: 99px;
    overflow: hidden;
    margin-bottom: 8px;
  }

  .progress-bar {
    height: 100%;
    border-radius: 99px;
    background: var(--card-accent, var(--accent));
    transition: width 0.6s ease;
  }

  .progress-label {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.82rem;
    color: var(--muted);
    display: flex;
    justify-content: space-between;
    gap: 8px;
  }

  .progress-pct {
    color: var(--card-accent, var(--accent));
    font-weight: 500;
  }

  /* ── New: Modal Style ── */
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(25, 50, 77, 0.4);
    backdrop-filter: blur(8px);
    z-index: 1000;
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s ease;
    padding: 20px;
  }

  .modal-overlay.active {
    opacity: 1;
    pointer-events: all;
  }

  .modal-container {
    background: var(--surface);
    border-radius: 24px;
    width: 100%;
    max-width: 650px;
    box-shadow: 0 24px 50px rgba(0, 0, 0, 0.15);
    overflow: hidden;
    transform: translateY(30px);
    transition: transform 0.3s ease;
    border: 1px solid var(--border);
  }

  .modal-overlay.active .modal-container {
    transform: translateY(0);
  }

  .modal-header {
    background: var(--surface2);
    padding: 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 1px solid var(--border);
  }

  .modal-profile {
    display: flex;
    align-items: center;
    gap: 16px;
  }

  .modal-title h3 {
    font-size: 1.3rem;
    font-weight: 700;
    color: var(--text);
  }

  .modal-title p {
    font-size: 0.95rem;
    color: var(--muted);
    margin-top: 2px;
  }

  .close-btn {
    background: transparent;
    border: none;
    font-size: 1.5rem;
    color: var(--muted);
    cursor: pointer;
    width: 36px;
    height: 36px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.2s;
  }

  .close-btn:hover {
    background: rgba(0, 0, 0, 0.05);
    color: var(--text);
  }

  .modal-body {
    padding: 24px;
    max-height: 70vh;
    overflow-y: auto;
  }

  /* ── Table Style ── */
  .detail-table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 8px;
    text-align: left;
  }

  .detail-table th, .detail-table td {
    padding: 14px 16px;
    border-bottom: 1px solid var(--border);
    font-size: 0.95rem;
  }

  .detail-table th {
    background: #F4F9FF;
    color: var(--text);
    font-weight: 600;
  }

  .detail-table th:first-child {
    border-top-left-radius: 10px;
    border-bottom-left-radius: 10px;
  }
  .detail-table th:last-child {
    border-top-right-radius: 10px;
    border-bottom-right-radius: 10px;
  }

  .detail-table td {
    color: var(--text);
  }

  /* Badge Evaluation Status */
  .eval-badge {
    display: inline-block;
    padding: 4px 12px;
    border-radius: 99px;
    font-size: 0.85rem;
    font-weight: 500;
  }
  .eval-badge.not-understand { background: #FFEDF1; color: var(--new); }
  .eval-badge.understand { background: #FFF7E6; color: var(--progress); }
  .eval-badge.can-do { background: #E6F9F0; color: var(--done); }

  .eval-score-card {
    --score-color: var(--progress);
    display: grid;
    gap: 6px;
    justify-items: start;
    min-width: 8.5rem;
  }

  .eval-score-card.not-understand { --score-color: var(--new); }
  .eval-score-card.understand { --score-color: var(--progress); }
  .eval-score-card.can-do { --score-color: var(--done); }
  .eval-score-card.pending { --score-color: var(--muted); opacity: 0.78; }

  .eval-score-main {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    line-height: 1;
  }

  .eval-score-number {
    color: var(--score-color);
    font-family: 'IBM Plex Mono', monospace;
    font-size: 1.7rem;
    font-weight: 500;
    line-height: 1;
    white-space: nowrap;
  }

  .eval-score-word {
    color: var(--muted);
    font-size: 0.82rem;
    font-weight: 600;
  }

  /* ── Schedule Table ── */
  .schedule-section {
    width: 100%;
    max-width: 1180px;
    margin: 0 auto;
  }

  .schedule-heading {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    gap: 18px;
    margin-bottom: 14px;
  }

  .schedule-kicker {
    color: var(--accent);
    font-size: 0.92rem;
    font-weight: 600;
    line-height: 1.35;
  }

  .schedule-heading h2 {
    color: var(--text);
    font-size: clamp(1.45rem, 2.6vw, 2rem);
    font-weight: 700;
    line-height: 1.18;
    margin-top: 3px;
  }

  .schedule-count {
    flex-shrink: 0;
    background: #FFFFFF;
    border: 1px solid var(--border);
    border-radius: 999px;
    color: var(--muted);
    font-size: 0.9rem;
    font-weight: 600;
    line-height: 1;
    padding: 10px 14px;
    box-shadow: 0 10px 22px rgba(71, 102, 132, 0.1);
  }

  .schedule-table {
    width: 100%;
    overflow-x: auto;
    border: 1px solid var(--border);
    border-radius: 16px;
    background: rgba(255, 255, 255, 0.9);
    box-shadow: 0 18px 36px rgba(71, 102, 132, 0.14);
  }

  .schedule-row {
    display: grid;
    grid-template-columns: 160px 140px minmax(240px, 1fr) 140px;
    min-width: 680px;
  }

  .schedule-row + .schedule-row {
    border-top: 1px solid var(--border);
  }

  .schedule-head {
    position: sticky;
    top: 0;
    z-index: 1;
    background: #F4F9FF;
  }

  .schedule-head .schedule-cell {
    color: var(--muted);
    font-size: 0.82rem;
    font-weight: 700;
    letter-spacing: 0.02em;
  }

  .schedule-cell {
    display: flex;
    align-items: center;
    min-width: 0;
    padding: 15px 18px;
    color: var(--text);
    font-size: 0.96rem;
    line-height: 1.35;
    overflow-wrap: anywhere;
  }

  .schedule-row:not(.schedule-head) {
    background: rgba(255, 255, 255, 0.84);
    transition: background 0.18s, transform 0.18s;
  }

  .schedule-row:not(.schedule-head):nth-child(odd) {
    background: #FBFDFF;
  }

  .schedule-row:not(.schedule-head):hover {
    background: #F1FAFF;
  }

  .schedule-date {
    color: var(--accent);
    font-family: 'IBM Plex Mono', monospace;
    font-weight: 500;
    white-space: nowrap;
  }

  .schedule-row:not(.schedule-head) .schedule-cell:nth-child(3) {
    font-weight: 600;
  }

  .shift-pill {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-width: 74px;
    border-radius: 999px;
    padding: 6px 12px;
    font-size: 0.84rem;
    font-weight: 700;
    line-height: 1;
    white-space: nowrap;
  }

  .shift-morning {
    background: #E6F9F0;
    color: #0D8A58;
  }

  .shift-afternoon {
    background: #FFF2D7;
    color: #A86200;
  }

  .shift-night {
    background: #E9F0FF;
    color: #3558B8;
  }


  /* ── Responsive ── */
  @media (max-width: 860px) {
    .cards-grid { grid-template-columns: repeat(2, 1fr); }
    body { justify-content: flex-start; }
    .schedule-row {
      grid-template-columns: 145px 120px minmax(220px, 1fr) 120px;
      min-width: 605px;
    }
  }

  @media (max-width: 480px) {
    body { padding: 22px 14px; }
    .page-header,
    .cards-grid {
      width: 100%;
      max-width: calc(100vw - 28px);
    }
    .page-header { margin-bottom: 18px; }
    .header-stats { width: 100%; justify-content: center; }
    .learning-hours-card { width: 100%; max-width: 340px; justify-content: center; }
    .learning-hours-circle { width: 76px; height: 76px; }
    .learning-hours-num { font-size: 1.75rem; }
    .cards-grid { grid-template-columns: 1fr; gap: 12px; }
    .card { min-height: 0; padding: 18px 16px; gap: 12px; }
    .avatar { width: 54px; height: 54px; border-radius: 14px; }
    .card-name { font-size: 1rem; }
    .progress-label { justify-content: flex-start; }
    .schedule-section { max-width: calc(100vw - 28px); }
    .schedule-heading { align-items: flex-start; flex-direction: column; gap: 10px; margin-bottom: 12px; }
    .schedule-count { padding: 8px 12px; font-size: 0.82rem; }
    .schedule-table { border-radius: 14px; }
    .schedule-row {
      grid-template-columns: 132px 105px minmax(180px, 1fr) 105px;
      min-width: 522px;
    }
    .schedule-cell { padding: 12px 14px; font-size: 0.84rem; }
    .schedule-head .schedule-cell { font-size: 0.76rem; }
    .shift-pill { min-width: 64px; padding: 5px 10px; font-size: 0.76rem; }
    .modal-header { padding: 16px; }
    .modal-body { padding: 16px; }
    .detail-table th, .detail-table td { padding: 10px 8px; font-size: 0.85rem; }
    .eval-score-card { min-width: 6.8rem; gap: 5px; }
    .eval-score-number { font-size: 1.35rem; }
    .eval-score-word { font-size: 0.72rem; }
  }
</style>
</head>

  function escapeAttr(value) {
    return String(value)
      .replace(/&/g, '&amp;')
      .replace(/"/g, '&quot;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;');
  }

  function getEvaluationRating(evaluation) {
    const label = String(evaluation ?? '').trim();

    if (!label) {
      return { score: 0, className: 'pending', label: 'ยังไม่มีผลประเมิน' };
    }

    const numericScore = Number(label);
    if (Number.isFinite(numericScore)) {
      const score = Math.max(0, Math.min(10, Math.round(numericScore)));
      const className = score >= 8
        ? 'can-do'
        : score >= 5
          ? 'understand'
          : score > 0
            ? 'not-understand'
            : 'pending';

      return { score, className, label: `${score} คะแนน` };
    }

    if (label.includes('ทำได้')) {
      return { score: 10, className: 'can-do', label };
    }

    if (label.includes('ไม่เข้าใจ')) {
      return { score: 3, className: 'not-understand', label };
    }

    if (label.includes('เข้าใจ')) {
      return { score: 7, className: 'understand', label };
    }

    return { score: 0, className: 'pending', label };
  }

  function renderEvaluationScore(evaluation) {
    const rating = getEvaluationRating(evaluation);
    const title = `${rating.score} คะแนน จาก 10`;
    const ariaLabel = `${rating.score} คะแนน จาก 10`;

    return `
      <div class="eval-score-card ${rating.className}" title="${escapeAttr(title)}" aria-label="${escapeAttr(ariaLabel)}">
        <div class="eval-score-main">
          <span class="eval-score-number">${rating.score}</span>
          <span class="eval-score-word">คะแนน</span>
        </div>
      </div>
    `;
  }

  function openModal(person) {

    // ตั้งค่าโปรไฟล์ใน Modal

    document.getElementById('modalTopic').textContent = person.topic;
    
    // จัดการรูปภาพ Avatar ใน Modal

    modalImg.style.display = 'block';
    modalFallback.style.display = 'none';

    modalFallback.style.background = person.accent;

    overlay.classList.add('active');

  function closeModal(event, forced = false) {
    const overlay = document.getElementById('modalOverlay');
    if (forced || event.target === overlay) {
